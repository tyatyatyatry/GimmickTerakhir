<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Izin Prinsip — Tya</title>
<style>
  :root{
    --folio-1:#2a62b4;
    --folio-2:#1b4488;
    --folio-edge:#11305f;
    --postit:#ffe27a;
    --postit-shadow:#e3c554;
    --paper:#fdfcf7;
    --ink:#262626;
    --bi-blue:#143a6e;
    --glow:#ffd34d;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:Arial, Helvetica, sans-serif;
    background:#0e0f13;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* ===================== SCENE STAGE ===================== */
  #scene{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 120% at 50% 30%, #20222a, #0c0d11 80%);
    transition:opacity .6s ease-in-out, visibility .6s;
  }
  #scene.hidden{opacity:0; visibility:hidden; pointer-events:none;}

  /* the photo, kept at its true aspect ratio (1069:992) and centered */
  .stage{
    position:relative;
    aspect-ratio:1069 / 992;
    width:min(100vw, calc(100vh * 1069 / 992));
    max-height:100vh;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    perspective:1200px;
  }
  .stage img.bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    user-select:none; -webkit-user-drag:none;
  }

  /* spotlight: gently darken everything except the folio to pull the eye there */
  .spotlight{
    position:absolute; inset:0;
    pointer-events:none;
    background:radial-gradient(34% 26% at 48.6% 62%,
                transparent 0%, transparent 55%, rgba(8,10,16,.30) 78%, rgba(8,10,16,.55) 100%);
    transition:background .6s ease-in-out, opacity .6s;
    z-index:3;
  }
  #scene.focused .spotlight{
    background:radial-gradient(40% 34% at 50% 50%,
                rgba(8,10,16,.55) 0%, rgba(8,10,16,.86) 60%, rgba(8,10,16,.95) 100%);
  }

  /* ---------- highlight ring over the painted folio (idle) ---------- */
  .highlight{
    position:absolute;
    left:48.6%; top:62.2%;
    width:30%; aspect-ratio:2.25 / 1;
    transform:translate(-50%,-50%) rotate(3.5deg);
    border-radius:10px;
    z-index:4;
    cursor:pointer;
    transition:opacity .4s ease;
  }
  .highlight .ring{
    position:absolute; inset:-6% -4%;
    border-radius:12px;
    border:2.5px solid rgba(255,211,77,.9);
    box-shadow:
      0 0 0 4px rgba(255,211,77,.18),
      0 0 22px 6px rgba(255,211,77,.55),
      inset 0 0 18px rgba(255,211,77,.35);
    animation:ringPulse 1.9s ease-in-out infinite;
  }
  @keyframes ringPulse{
    0%,100%{transform:scale(1); opacity:.85;}
    50%{transform:scale(1.05); opacity:1;}
  }
  /* shine sweep across the folio */
  .highlight .shine{
    position:absolute; inset:0;
    border-radius:10px;
    overflow:hidden;
  }
  .highlight .shine::before{
    content:"";
    position:absolute; top:-40%; left:-60%;
    width:50%; height:180%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    transform:skewX(-18deg);
    animation:sweep 3.2s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{left:-60%;} 55%{left:140%;} 100%{left:140%;}
  }
  #scene.focused .highlight{opacity:0; pointer-events:none;}

  /* bobbing call-out label above the folio */
  .callout{
    position:absolute;
    left:48.6%; top:46%;
    transform:translate(-50%,-50%);
    z-index:6;
    pointer-events:none;
    transition:opacity .4s ease;
  }
  .callout .bubble{
    background:#fff;
    color:#7a5a00;
    font-weight:bold;
    font-size:clamp(.72rem, 1.7vmin, .95rem);
    padding:.5em .9em;
    border-radius:999px;
    box-shadow:0 6px 16px rgba(0,0,0,.45);
    white-space:nowrap;
    animation:bob 2.2s ease-in-out infinite;
  }
  .callout .bubble::after{
    content:"";
    position:absolute; left:50%; bottom:-8px;
    transform:translateX(-50%);
    border:7px solid transparent;
    border-top-color:#fff;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-7px);}
  }
  #scene.focused .callout{opacity:0;}

  /* ===================== INTERACTIVE FOLIO (lifts out) ===================== */
  #folio{
    position:absolute;
    left:48.6%; top:60%;
    width:24%;
    aspect-ratio:3 / 4;
    transform-style:preserve-3d;
    z-index:5;
    cursor:pointer;
    opacity:0;                       /* hidden during idle; photo shows the real one */
    pointer-events:none;
    /* lying foreshortened on the desk */
    transform:translate(-50%,-58%) rotateX(60deg) rotate(3.5deg) scale(1.05);
    transition:transform .8s ease-in-out, opacity .45s ease-in-out, filter .4s;
    filter:drop-shadow(10px 18px 14px rgba(0,0,0,.5));
    outline:none;
  }
  #scene.focused #folio{opacity:1; pointer-events:auto;}
  #folio.standing{
    transform:translate(-50%,-52%) rotateX(0deg) rotate(0deg) scale(1.85);
    filter:drop-shadow(0 36px 34px rgba(0,0,0,.6))
           drop-shadow(0 0 26px rgba(255,211,77,.35));
  }
  @media (max-width:680px){
    #folio{width:38%;}
    #folio.standing{transform:translate(-50%,-50%) rotateX(0) rotate(0) scale(1.7);}
  }

  #folio .inner{
    position:absolute; inset:2% 2% 2% 3%;
    background:linear-gradient(180deg,#fffef9,#f0ead9);
    border-radius:4px 10px 10px 4px;
    box-shadow:inset 0 0 14px rgba(0,0,0,.12);
  }
  #folio .inner::before{
    content:"MEMORANDUM";
    position:absolute; top:10%; left:50%; transform:translateX(-50%);
    font-size:.58em; letter-spacing:.25em; font-weight:bold; color:#aaa193;
  }
  #folio .inner::after{
    content:"";
    position:absolute; inset:22% 14% 14% 14%;
    background:repeating-linear-gradient(0deg, rgba(120,112,98,.4) 0 2px, transparent 2px 13px);
    opacity:.55;
  }
  #folio .cover{
    position:absolute; inset:0;
    transform-origin:left center;
    transform-style:preserve-3d;
    transform:translateZ(4px);
    transition:transform .8s ease-in-out;
    border-radius:6px 12px 12px 6px;
    background:
      radial-gradient(120% 120% at 20% 10%, rgba(255,255,255,.18), transparent 45%),
      linear-gradient(135deg, var(--folio-1) 0%, var(--folio-2) 70%, var(--folio-edge) 100%);
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.07),
      inset -8px 0 14px rgba(0,0,0,.25),
      4px 5px 0 rgba(8,22,46,.6);
    backface-visibility:hidden;
  }
  #folio .cover::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:9%;
    background:linear-gradient(90deg, var(--folio-edge), rgba(255,255,255,.08) 80%, transparent);
    border-radius:6px 0 0 6px;
  }
  #folio .cover::after{
    content:"D E K S";
    position:absolute; inset:8% 9%;
    border:1.5px solid rgba(255,255,255,.24);
    border-radius:4px;
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:7%;
    color:rgba(255,255,255,.5);
    font-size:.6em; letter-spacing:.5em; text-indent:.5em;
  }
  #folio.open .cover{transform:translateZ(4px) rotateY(-165deg);}

  .postit{
    position:absolute;
    left:50%; top:30%;
    width:60%;
    aspect-ratio:1 / 1;
    transform:translateX(-50%) rotate(-5deg);
    background:linear-gradient(180deg, #fff0a3 0%, var(--postit) 55%, var(--postit-shadow) 100%);
    box-shadow:0 8px 10px rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:8%;
    font-family:"Segoe Script","Bradley Hand","Comic Sans MS",cursive;
    color:#4a3b12;
    font-size:clamp(.8rem, 2.6vmin, 1.2rem);
    line-height:1.25;
    z-index:2;
  }
  .postit::before{
    content:"";
    position:absolute; top:-7%; left:50%;
    transform:translateX(-50%) rotate(2deg);
    width:42%; height:13%;
    background:rgba(255,255,255,.55);
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  .postit::after{
    content:"";
    position:absolute; right:0; bottom:0;
    border-style:solid; border-width:0 0 16% 16%;
    border-color:transparent transparent rgba(40,20,0,.10) transparent;
  }

  /* ===================== MEMO VIEW ===================== */
  #memoView{
    position:fixed; inset:0;
    background:radial-gradient(120% 100% at 50% 0%, #4a5568 0%, #2d3543 70%);
    display:flex; justify-content:center;
    padding:clamp(10px,3vmin,36px);
    opacity:0; visibility:hidden;
    transition:opacity .6s ease-in-out, visibility .6s;
    z-index:50; overflow:hidden;
  }
  #memoView.show{opacity:1; visibility:visible;}
  .paper{
    background:var(--paper); color:var(--ink);
    width:min(820px, 100%); max-height:100%; overflow-y:auto;
    border-radius:4px; box-shadow:0 30px 60px rgba(0,0,0,.5);
    padding:clamp(20px,5vmin,58px) clamp(18px,6vmin,64px);
    line-height:1.7; font-size:clamp(.86rem, 2.3vmin, 1rem);
    transform:translateY(24px); transition:transform .6s ease-in-out;
  }
  #memoView.show .paper{transform:translateY(0);}
  .kop{display:flex; align-items:center; justify-content:space-between; gap:1rem; padding-bottom:.6rem;}
  .brand{display:flex; align-items:center; gap:.7rem;}
  .bi-mark{
    width:44px; height:44px; flex:0 0 auto;
    border:3px solid var(--bi-blue); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:Georgia,"Times New Roman",serif; font-weight:bold; font-size:1.05rem; color:var(--bi-blue);
  }
  .brand .name{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(1rem,3vmin,1.3rem); letter-spacing:.12em; color:var(--bi-blue); font-weight:bold;
  }
  .mtag{border:2px solid var(--ink); padding:.15rem .8rem; font-weight:bold; font-size:.85em; align-self:flex-start;}
  .memo-no{font-size:.9em; margin-top:.8rem;}
  h1.memo-title{text-align:center; font-size:1.25em; letter-spacing:.18em; margin:.8rem 0 1.2rem;}
  table.head{width:100%; border-collapse:collapse; margin-bottom:.6rem; font-size:.97em;}
  table.head td{vertical-align:top; padding:.12rem 0;}
  table.head td:first-child{width:5.2em; font-weight:600;}
  table.head td:nth-child(2){width:1em;}
  .rule{border:none; border-top:2.5px solid var(--ink); margin:.6rem 0 1.4rem;}
  .paper p{margin-bottom:1rem; text-align:justify;}
  .paper p.ref{font-style:italic;}
  .sign{margin-top:2.4rem; margin-left:auto; width:fit-content; text-align:center;}
  .sign .script{
    font-family:"Segoe Script","Bradley Hand","Comic Sans MS",cursive;
    font-size:1.5em; color:var(--bi-blue); margin:.9rem 0 .2rem; transform:rotate(-3deg);
  }
  .sign .uname{font-weight:bold; text-decoration:underline;}
  #backBtn{
    position:fixed; top:clamp(10px,2.5vmin,22px); left:clamp(10px,2.5vmin,22px);
    z-index:60; background:rgba(255,255,255,.12); color:#fff;
    border:1px solid rgba(255,255,255,.4); border-radius:999px;
    padding:.5rem 1.1rem; font-size:.85rem; cursor:pointer;
    backdrop-filter:blur(4px); transition:background .3s; opacity:0; visibility:hidden;
  }
  #memoView.show ~ #backBtn{opacity:1; visibility:visible;}
  #backBtn:hover{background:rgba(255,255,255,.25);}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important; transition-duration:.01s !important;}
  }
</style>
</head>
